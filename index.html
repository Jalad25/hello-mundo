    <script>
      // Companion to public/404.html: if we arrived via the SPA hack
      // (?/path), rewrite the URL back to its real path before Vue Router boots.
      (function () {
        var l = window.location;
        if (l.search.startsWith('?/')) {
          var decoded = l.search.slice(2).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          });
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded.shift() + (decoded.length ? '?' + decoded.join('&') : '') + l.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
